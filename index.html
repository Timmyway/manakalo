<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert currencies between USD, EUR, CNY, and Malagasy Ariary instantly. Easy, fast, and accurate currency converter.">
    <meta name="keywords" content="currency converter, USD to MGA, EUR to MGA, CNY to MGA, Malagasy Ariary, online converter">
    <meta name="robots" content="index, follow">
    <title>Currency Converter | USD, EUR, CNY to Malagasy Ariary</title>
    <meta property="og:title" content="Manakalo Currency Converter">
    <meta property="og:description" content="Instantly convert currencies with real-time exchange rates.">
    <meta property="og:image" content="https://tools.devambition.com/manakalo/og-image.png">
    <meta property="og:url" content="https://tools.devambition.com/manakalo/">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 640px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .currency-flag {
            display: inline-block;
            font-size: 24px;
            margin-right: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }

        input[type="number"] {
            flex: 1;
            padding: 16px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #667eea;
        }

        select {
            padding: 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            background: white;
            transition: border-color 0.3s;
            min-width: 150px;
        }

        select:focus {
            border-color: #667eea;
        }

        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin: 25px 0;
            text-align: center;
        }

        .result-amount {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .exchange-rate {
            font-size: 14px;
            opacity: 0.9;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
        }

        .btn-swap {
            background: #667eea;
            color: white;            
        }

        .btn-swap:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-refresh {
            background: #48bb78;
            color: white;
        }

        .btn-refresh:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-refresh:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }

        .status.loading {
            color: #667eea;
        }

        .status.error {
            color: #e53e3e;
        }

        .status.success {
            color: #48bb78;
        }

        .swap-icon {
            display: inline-block;
            transition: transform 0.3s;
        }

        .btn-swap:active .swap-icon {
            transform: rotate(180deg);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .result-amount {
                font-size: 28px;
            }

            .input-wrapper {
                flex-direction: column;
            }

            select {
                width: 100%;
            }
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        .toggle-container {            
            margin-bottom: 15px;
            font-size: 14px;
            display: flex; align-items: center;
        }

        .toggle-container label {
            cursor: pointer;
            user-select: none;
            padding-bottom: 0;            
        }

        .toggle-container input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
            vertical-align: middle;
        }

        .description-text {            
            margin-bottom: 25px;
            color: #555;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="currency-flag">💱</span>Currency Converter</h1>
        <p class="description-text">Quickly convert USD, EUR, or CNY to Malagasy Ariary (MGA) with real-time rates. Rounded results available for easier reading.</p>
        
        <div class="input-group">
            <label>Amount & Currency</label>
            <div class="input-wrapper">
                <input type="number" id="amount" placeholder="Enter amount" min="0" step="any" autofocus>
                <select id="currencyPair" aria-label="Select currency pair">
                    <option value="USD_MGA">USD → MGA</option>
                    <option value="MGA_USD">MGA → USD</option>
                    <option value="EUR_MGA">EUR → MGA</option>
                    <option value="MGA_EUR">MGA → EUR</option>
                    <option value="CNY_MGA">CNY → MGA</option>
                    <option value="MGA_CNY">MGA → CNY</option>
                </select>
            </div>
        </div>

        <div class="toggle-container">
            <label>
                <input type="checkbox" id="roundToggle">
                <span>Round Result</span>
            </label>
        </div>

        <div class="result-box">
            <div class="result-amount" id="result">0.00</div>
            <div class="exchange-rate" id="exchangeRate">Enter amount to convert</div>            
        </div>

        <div class="button-group">
            <button class="btn-swap" id="swapBtn">
                <span class="swap-icon">⇄</span> Swap
            </button>
            <button class="btn-refresh" id="refreshBtn">
                ↻ Refresh Rates
            </button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const API_BASE = 'https://open.er-api.com/v6/latest';
        const CACHE_DURATION = 12 * 60 * 60 * 1000; // 12 hours
        const STORAGE_KEY = 'currencyRates';
        const PAIR_KEY = 'selectedCurrencyPair';

        const elements = {
            amount: document.getElementById('amount'),
            currencyPair: document.getElementById('currencyPair'),
            result: document.getElementById('result'),
            exchangeRate: document.getElementById('exchangeRate'),
            swapBtn: document.getElementById('swapBtn'),
            refreshBtn: document.getElementById('refreshBtn'),
            status: document.getElementById('status')
        };

        let rates = {
            USD: 4600,
            EUR: 5000,
            CNY: 640,
            MGA: 1
        };

        const currencySymbols = {
            USD: '$',
            EUR: '€',
            CNY: '¥',
            MGA: 'Ar'
        };        

        function loadCachedRates() {
            try {
                const cached = localStorage.getItem(STORAGE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    const age = Date.now() - data.timestamp;
                    
                    if (age < CACHE_DURATION) {
                        rates = data.rates;
                        showStatus(`Using cached rates (${Math.round(age / 3600000)}h old)`, 'success');
                        return true;
                    }
                }
            } catch (e) {
                console.error('Error loading cached rates:', e);
            }
            return false;
        }

        function saveRates() {
            try {
                const data = {
                    timestamp: Date.now(),
                    rates: rates
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('Error saving rates:', e);
            }
        }

        async function fetchRates() {
            showStatus('Fetching latest rates...', 'loading');
            elements.refreshBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/USD`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();

                // Convert all to MGA base
                const mgaPerUsd = data.rates.MGA; // e.g. 4600 MGA = 1 USD
                rates = {
                    MGA: 1,
                    USD: mgaPerUsd,
                    EUR: mgaPerUsd / data.rates.EUR,
                    CNY: mgaPerUsd / data.rates.CNY
                };

                saveRates();
                showStatus('Rates updated successfully!', 'success');
                convert();
                
                setTimeout(() => showStatus('', ''), 3000);
            } catch (error) {
                console.error('Error fetching rates:', error);
                showStatus('Failed to fetch rates. Using cached data.', 'error');
                loadCachedRates();
                setTimeout(() => showStatus('', ''), 3000);
            } finally {
                elements.refreshBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            elements.status.textContent = message;
            elements.status.className = `status ${type}`;
        }

        function convert() {
            const amount = parseFloat(elements.amount.value);
            const pair = elements.currencyPair.value;
            const [from, to] = pair.split('_');

            if (!amount || amount <= 0) {
                elements.result.textContent = '0.00';
                elements.exchangeRate.textContent = 'Enter amount to convert';
                return;
            }

            let result;
            let rate;

            if (from === 'MGA') {
                rate = 1 / rates[to];
                result = amount / rates[to];
            } else if (to === 'MGA') {
                rate = rates[from];
                result = amount * rates[from];
            } else {
                // Foreign to foreign (via USD)
                const toUSD = amount / rates[from];
                result = toUSD * rates[to];
                rate = rates[to] / rates[from];
            }

            const fromSymbol = currencySymbols[from];
            const toSymbol = currencySymbols[to];

            elements.result.textContent = `${toSymbol} ${formatNumber(result)}`;
            elements.exchangeRate.textContent = `1 ${from} = ${formatNumber(rate)} ${to}`;
        }

        function swap() {
            const pair = elements.currencyPair.value;
            const [from, to] = pair.split('_');
            elements.currencyPair.value = `${to}_${from}`;
            saveSelectedPair(); // ← save the new swapped pair
            convert();
        }

        // Load cached pair
        function loadSelectedPair() {
            const savedPair = localStorage.getItem(PAIR_KEY);
            if (savedPair) {
                elements.currencyPair.value = savedPair;
            }
        }

        // Save selected pair
        function saveSelectedPair() {
            const currentPair = elements.currencyPair.value;
            localStorage.setItem(PAIR_KEY, currentPair);
        }

        // Event listeners
        elements.amount.addEventListener('input', convert);
        elements.currencyPair.addEventListener('change', () => {
            saveSelectedPair();
            convert();
        });
        elements.swapBtn.addEventListener('click', swap);
        elements.refreshBtn.addEventListener('click', fetchRates);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement === elements.amount) {
                convert();
            } else if (e.key.toLowerCase() === 's' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                swap();
            } else if (e.key.toLowerCase() === 'r' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                fetchRates();
            }
        });

        const roundToggle = document.getElementById('roundToggle');

        function formatNumber(num) {
            if (roundToggle.checked) {
                // Explicitly round first
                num = Math.round(num);
            }

            return new Intl.NumberFormat('fr-FR').format(num);
        }

        // Recalculate on toggle change
        roundToggle.addEventListener('change', convert);

        // Initialize
        (async function init() {
            loadSelectedPair(); // 🔹 Restore last selected pair first

            const hasCached = loadCachedRates();
            
            if (!hasCached) {
                await fetchRates();
            } else {
                // Check if cache is getting old and refresh in background
                const cached = JSON.parse(localStorage.getItem(STORAGE_KEY));
                const age = Date.now() - cached.timestamp;
                if (age > CACHE_DURATION / 2) {
                    fetchRates();
                }
            }
            
            convert();
        })();
    </script>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",

            "operatingSystem": "All",
            "description": "Convert currencies between USD, EUR, CNY, and Malagasy Ariary instantly."
        }
    </script>
</body>
</html>
